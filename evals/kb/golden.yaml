# Golden set for the knowledge-base retrieval eval (make eval-kb).
#
# Format: top-level key `items`, a list of:
#   id            unique string
#   lang          en | es    language the candidate spoke
#   question      the candidate's words (paraphrased, casual, some with speech-recognition
#                 noise or mixed English/Spanish)
#   query_es      the short Spanish search query the model should write for search_knowledge
#   expected      list of chunk ids that answer the question (any of them counts as a hit);
#                 [] for out-of-scope items
#   out_of_scope  true when the knowledge base does not cover the question (must return no_match)
#   tags          optional: asr (speech-recognition noise), mixed (code-switching)
#
# Chunk ids are `{doc_id}#{section-slug}`: the slug of the `###` heading if present, else the
# `##` heading (lowercase, accents stripped, non-alphanumerics -> single '-', trimmed).
# Short `###` subsections are folded into their parent chunk, so every id below is the slug of a
# `##` parent heading.
# Validated on 2026-11-11 against hr_screener.knowledge.chunking.load_chunks(knowledge/): every
# expected id exists. Re-run that check whenever headings change or MIN_WORDS / MAX_WORDS change.
# Items tagged `near` are out of scope but close to the topics the KB covers (use them to tune
# KB_MIN_SCORE separately from far-topic no-match items).
