# system_one design v2 (evals/turn_taking/designs.py): same samples and agent as system_one.yaml;
# only the turn-taking tuning differs. The reason for each value is next to it in designs.py.
run_name: system-one-v2-holdout-telephony
data_root: evals/turn_taking/data/fdb
env_file: .env
selection:
  seed: 0
  # Paired with the held-out baseline: run baseline_holdout.yaml first (it writes this manifest).
  from_manifest: evals/results/turn_taking/baseline-holdout-telephony/manifest.json
  tasks:
    v1/candor_pause_handling: {n: 10}
    v1/candor_turn_taking: {n: 10}
    v1.5/user_backchannel: {n: 10}
    v1.5/user_interruption: {n: 10}
    v1.5/background_speech: {n: 10}
    v1.5/talking_to_other: {n: 10}
agent:
  variant: system_one
  design: v2                # named param set (evals/turn_taking/designs.py)
  audio_profile: telephony
  settings_overrides: {}
run:
  concurrency: 2
  trailing_silence_secs: 2.0
  clean_inputs: true
  skip_existing: true
  max_session_starts_per_minute: 4
  max_retries: 2
  retry_wait_secs: 60
  tool_latency_secs: 0.3
eval:
  device: auto
  metrics: all
  judge: {provider: anthropic, model: claude-sonnet-5-5}
