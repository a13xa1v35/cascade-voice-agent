# Full-Duplex-Bench inference config. Agent settings come from env_file as-is
# (language is always forced to en: FDB inputs are English).
run_name: baseline-env-telephony
data_root: evals/turn_taking/data/fdb
env_file: .env
selection:
  seed: 0
  from_manifest: null          # another run's manifest.json: reuse its exact samples (paired A/B)
  tasks:                       # "<version>/<task>": {n: int} | {ids: [..]} | {all: true}
    # Tier 1: end-of-turn vs. pause, and real vs. non-interrupting overlap
    v1/candor_pause_handling: {n: 10}     # pause mid-thought: don't take over (TOR lower is better)
    v1/candor_turn_taking: {n: 10}        # user finished: respond, fast (TOR higher, latency lower)
    v1.5/user_backchannel: {n: 10}        # "yeah/ok" while the bot talks: keep talking
    v1.5/user_interruption: {n: 10}       # real barge-in: stop fast, then respond
    # Tier 2: overlap that isn't addressed to the bot
    v1.5/background_speech: {n: 10}       # TV / other people: ignore
    v1.5/talking_to_other: {n: 10}        # user speaks to someone else: ignore
agent:
  variant: baseline            # key into the variant registry (evals.turn_taking.variants)
  audio_profile: telephony     # telephony (8k + mu-law round-trip on input) | web (16k in / 24k out)
  settings_overrides: {}       # on top of the env_file Settings (language is not overridable)
run:
  concurrency: 2
  trailing_silence_secs: 2.0   # appended so Smart Turn can close the last user turn; output truncated
  clean_inputs: true           # v1.5: also run clean_input.wav -> clean_output.wav
  skip_existing: true
  max_session_starts_per_minute: 4   # AssemblyAI allows 5 new sessions/min; keep headroom for reconnects
  max_retries: 2                     # rate-limited sessions only
  retry_wait_secs: 60
  tool_latency_secs: 0.3       # simulated latency of each mock tool (fixed bench agent)
eval:                          # read by stage 2 only
  device: auto
  metrics: all                 # local | all (all = also run the LLM judge where a task has one)
  judge: {provider: anthropic, model: claude-sonnet-5-5}
